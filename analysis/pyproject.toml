[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liftlab"
version = "0.1.0"
description = "Analysis of the Hillstrom MineThatData email experiment."
requires-python = ">=3.12,<3.13"

[tool.setuptools]
packages = ["liftlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
